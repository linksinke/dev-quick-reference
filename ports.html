  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .search .k{position:absolute;right:10px;top:9px;font:11px var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:#fff}

  .f{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;color:#43506b;cursor:pointer;user-select:none}
  .f.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .f:hover{border-color:var(--brand)}
  .wrap{max-width:1040px;margin:22px auto 0;padding:0 28px}
  section{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
  h2{font-size:13.5px;font-weight:600;padding:12px 16px;background:#fbfcfd;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  h2 .c{font:11.5px var(--mono);color:#9aa4b2;font-weight:400}
  .row{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:11px 16px;border-bottom:1px solid #f0f2f5}
  .row:last-child{border-bottom:0}
  .row:hover{background:#fafcfb}
  .code{font:600 13.5px var(--mono);color:#1f2d3d;display:flex;align-items:center;gap:6px;word-break:break-all}
  .code .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .name{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .name .en{font:12px var(--mono);color:#8a94a3;font-weight:400}
  .tag{font-size:11px;padding:1px 7px;border-radius:5px;background:#eef2f6;color:#5b6675}
  .tag.dav{background:#fdf1e6;color:#a56a26}
  .tag.hot{background:var(--brand-soft);color:var(--brand)}
  .desc{color:#4b5563;font-size:12.5px;margin-top:2px}
  .empty{color:var(--muted);text-align:center;padding:36px;background:var(--panel);border:1px dashed var(--border);border-radius:12px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:#1f2937;color:#fff;font-size:12.5px;padding:8px 16px;border-radius:999px;opacity:0;transition:.18s;pointer-events:none;z-index:99}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  mark{background:#fde68a;border-radius:3px;padding:0 1px}
  @media (max-width:760px){.wrap{padding:0 14px}.row{grid-template-columns:74px 1fr;gap:10px}header{padding:14px}}

  {cat:'开发与调试', color:'#6b7280', items:[
    [9418,'Git Protocol','Git 原生协议','只读匿名克隆，现多用 HTTPS/SSH'],
    [9229,'Node Inspector','Node.js 调试器','--inspect 默认，暴露可远程执行代码'],
    [5005,'Java JDWP','JVM 远程调试','生产开启等于开后门'],
    [35729,'LiveReload','前端热更新','老式 livereload 默认端口']
  ]}
];

const HOT_TAG = ['常用'];
const q = document.getElementById('q');
const body = document.getElementById('body');
const filters = document.getElementById('filters');
let active = '全部';

const MAP = {'Web':'Web','文件':'文件','邮件':'邮件','远程':'远程','数据库':'数据库','消息':'缓存','搜索':'搜索','Hadoop':'Hadoop','计算':'计算','中间件':'Java','容器':'容器','监控':'监控','网络':'目录','开发':'开发'};

filters.innerHTML = ['全部','Web','文件','邮件','远程','数据库','消息','搜索','Hadoop','计算','中间件','容器','监控','网络','开发']
  .map(f => `<span class="f${f==='全部'?' on':''}" data-f="${f}">${f}</span>`).join('');
filters.addEventListener('click', e => {
  const t = e.target.closest('[data-f]');
  if(!t) return;
  active = t.dataset.f;
  [...filters.children].forEach(c => c.classList.toggle('on', c.dataset.f === active));
  render();
});

function hl(s, kw){
  const esc = String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  if(!kw) return esc;
  const i = esc.toLowerCase().indexOf(kw.toLowerCase());
  if(i < 0) return esc;
  return esc.slice(0,i) + '<mark>' + esc.slice(i,i+kw.length) + '</mark>' + esc.slice(i+kw.length);
}

function render(){
  const kw = q.value.trim();
  const low = kw.toLowerCase();
  const groups = DATA.map(g => ({
    cat: g.cat, color: g.color,
    items: g.items.filter(it => {
      if(active !== '全部' && !g.cat.startsWith(MAP[active])) return false;
      if(!kw) return true;
      return (it[0] + ' ' + it[1] + ' ' + it[2] + ' ' + it[3] + ' ' + it[4]).toLowerCase().includes(low);
    })
  })).filter(g => g.items.length);

  if(!groups.length){
    body.innerHTML = '<div class="empty">没有匹配的端口，换个关键词试试</div>';
    return;
  }
  body.innerHTML = groups.map(g => `
    <section>
      <h2>${g.cat}<span class="c">${g.items.length} 个</span></h2>
      ${g.items.map(it => `
        <div class="row">
          <div class="code" data-copy="${it[0]}" title="点击复制端口号"><span class="dot" style="background:${g.color}"></span>${it[0]}</div>
          <div>
            <div class="name">${hl(it[1], kw)}<span class="en">${hl(it[2], kw)}</span>
              ${HOT_TAG.includes(it[4]) ? `<span class="tag hot">${it[4]}</span>` : (it[4] ? `<span class="tag${(it[4]==='冲突'||it[4]==='清单')?' dav':''}">${it[4]}</span>` : '')}
            </div>
            <div class="desc">${hl(it[3], kw)}</div>
          </div>
        </div>`).join('')}
    </section>`).join('');
}

let tid;
function tip(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(tid); tid = setTimeout(() => t.classList.remove('on'), 1400);
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if(!c || c.closest('.f')) return;
  const text = c.dataset.copy;
  const done = () => tip('已复制 ' + text);
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => fb(text, done));
  else fb(text, done);
});
function fb(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ tip('复制失败'); }
  document.body.removeChild(ta);
}
q.addEventListener('input', render);
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if(e.key === 'Escape'){ q.value=''; render(); q.blur(); }
});
render();
</script>
</body>
</html>
