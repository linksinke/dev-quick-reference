<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正则备忘录 · 单页版</title>
<style>
  :root{--bg:#f6f8fa;--panel:#fff;--border:#e4e8ee;--text:#1f2937;--muted:#6b7280;--brand:#2f7d5f;--brand-soft:#eaf5f0;--code:#f2f4f7;--mono:'Cascadia Mono',Consolas,'Courier New',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif;padding-bottom:60px}
  header{position:sticky;top:0;z-index:10;background:rgba(246,248,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:16px 28px}
  .htop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:19px;font-weight:700}
  .sub{color:var(--muted);font-size:12.5px}
  .search{position:relative;max-width:520px}
  .search input{width:100%;height:38px;border:1px solid var(--border);border-radius:10px;padding:0 38px 0 12px;background:#fff;font-size:13.5px;outline:none}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .search .k{position:absolute;right:10px;top:9px;font:11px var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:#fff}
  .wrap{max-width:1040px;margin:22px auto 0;padding:0 28px}
  section{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
  h2{font-size:13.5px;font-weight:600;padding:12px 16px;background:#fbfcfd;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
  h2 .c{font:11.5px var(--mono);color:#9aa4b2;font-weight:400}
  table{width:100%;border-collapse:collapse}
  td{padding:8px 16px;border-bottom:1px solid #f0f2f5;vertical-align:top;font-size:13px}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#fafcfb}
  td.ex{width:38%;white-space:nowrap}
  code{font:12.5px var(--mono);background:var(--code);border:1px solid #e8ebf0;border-radius:6px;padding:2px 7px;color:#1f2d3d;cursor:pointer;display:inline-block}
  code:hover{border-color:var(--brand);color:var(--brand)}
  .desc{color:#4b5563}
  .tip{color:#8a94a3;font-size:12px;display:block;margin-top:3px}
  .notes{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px}
  .notes h3{font-size:13.5px;margin-bottom:8px}
  .notes ul{margin-left:18px;color:#4b5563;font-size:13px}
  .notes li{margin:4px 0}
  .empty{color:var(--muted);text-align:center;padding:36px;background:var(--panel);border:1px dashed var(--border);border-radius:12px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:#1f2937;color:#fff;font-size:12.5px;padding:8px 16px;border-radius:999px;opacity:0;transition:.18s;pointer-events:none;z-index:99}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  mark{background:#fde68a;border-radius:3px;padding:0 1px}
  @media (max-width:860px){.wrap{padding:0 14px}td.ex{width:45%;white-space:normal}header{padding:14px}}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>正则备忘录</h1>
    <span class="sub">JavaScript 正则语法速查 · 点击表达式复制</span>
  </div>
  <div class="search">
    <input id="q" placeholder="搜索：数字 / 空白 / 分组 / 前瞻 / 量词" autocomplete="off">
    <span class="k">/</span>
  </div>
</header>

<div class="wrap">
  <div id="head"></div>
  <div id="body"></div>
</div>
<div id="toast"></div>

<script>
const DATA = [
  {cat:'普通字符', rows:[
    ['`.` 或 `[^\\n\\r]`','任意字符，不含换行与回车'],
    ['[A-Za-z]','字母'],
    ['[a-z]','小写字母'],
    ['[A-Z]','大写字母'],
    ['\\d 或 [0-9]','数字'],
    ['\\D 或 [^0-9]','非数字'],
    ['_','下划线'],
    ['\\w 或 [A-Za-z0-9_]','字母、数字或下划线'],
    ['\\W 或 [^A-Za-z0-9_]','\\w 的反集'],
    ['\\S','\\s 的反集（非空白）']
  ]},
  {cat:'空白字符', rows:[
    ['空格字符','空格'],
    ['\\t','制表符 Tab'],
    ['\\n','换行'],
    ['\\r','回车'],
    ['\\s','空格、制表符、换行或回车']
  ]},
  {cat:'字符集', rows:[
    ['[xyz]','x、y 或 z 之一'],
    ['[^xyz]','不是 x、y、z 中的任何一个'],
    ['[1-3]','1、2 或 3'],
    ['[^1-3]','不是 1、2、3 中的任何一个'],
    ['说明','方括号内相当于对每个字符做 OR；开头加 ^ 表示取反；集合内的 . 就是字面量句点']
  ]},
  {cat:'需要转义的字符（集合外）', rows:[
    ['\\.','句点'],['\\^','脱字符'],['\\$','美元符'],['\\|','竖线'],['\\\\','反斜杠'],
    ['\\/','正斜杠'],['\\(','左圆括号'],['\\)','右圆括号'],['\\[','左方括号'],['\\]','右方括号'],
    ['\\{','左花括号'],['\\}','右花括号']
  ]},
  {cat:'需要转义的字符（集合内）', rows:[
    ['\\\\','反斜杠'],
    ['\\]','右方括号'],
    ['说明','^ 只在紧跟 [ 之后时需转义；- 只在两个字母或两个数字之间时需转义']
  ]},
  {cat:'量词', rows:[
    ['{2}','恰好 2 次'],
    ['{2,}','至少 2 次'],
    ['{2,7}','2 到 7 次'],
    ['*','0 次或多次'],
    ['+','1 次或多次'],
    ['?','0 次或 1 次'],
    ['说明','量词放在被修饰表达式之后，默认贪婪（加 ? 变懒惰，如 .*?）']
  ]},
  {cat:'边界', rows:[
    ['^','字符串开头（m 模式下为行首）'],
    ['$','字符串结尾（m 模式下为行尾）'],
    ['\\b','单词边界'],
    ['说明','\\b 出现在：开头且首字符为 \\w；\\w 与 \\W 相邻之间；结尾且末字符为 \\w']
  ]},
  {cat:'匹配与断言', rows:[
    ['foo\\|bar','匹配 foo 或 bar'],
    ['foo(?=bar)','foo 后面是 bar 才匹配（正向先行断言）'],
    ['foo(?!bar)','foo 后面不是 bar 才匹配（负向先行断言）'],
    ['(?<=bar)foo','foo 前面是 bar 才匹配（正向后行断言）'],
    ['(?<!bar)foo','foo 前面不是 bar 才匹配（负向后行断言）']
  ]},
  {cat:'分组与捕获', rows:[
    ['(foo)','捕获组：匹配并捕获 foo'],
    ['(?:foo)','非捕获组：匹配 foo 但不捕获'],
    ['(foo)bar\\1','\\1 反向引用第 1 个捕获组，匹配 foobarfoo'],
    ['说明','捕获组只对 match / matchAll / replace(回调) 有效；\\N 引用第 N 个组，编号从 1 开始']
  ]},
  {cat:'常用实例', rows:[
    ['^\\d{11}$','中国大陆手机号（11 位数字）'],
    ['^[\\w.%+-]+@[\\w.-]+\\.[A-Za-z]{2,}$','基础邮箱格式'],
    ['^https?:\\/\\/[^\\s]+$','http/https 链接'],
    ['^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$','十六进制颜色值'],
    ['^\\d{4}-\\d{2}-\\d{2}$','日期 YYYY-MM-DD'],
    ['^(?:\\d{1,3}\\.){3}\\d{1,3}$','IPv4 地址（宽松校验）']
  ]}
];

const RE = /`([^`]+)`/g;
const q = document.getElementById('q');
const toast = document.getElementById('toast');

function md(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
          .replace(RE, '<code>$1</code>');
}
function plain(s){return s.replace(/`/g,'')}
function hl(s, kw){
  if(!kw) return s;
  const esc = s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const i = esc.toLowerCase().indexOf(kw.toLowerCase());
  if(i < 0) return esc;
  return esc.slice(0,i) + '<mark>' + esc.slice(i,i+kw.length) + '</mark>' + esc.slice(i+kw.length);
}
function row(ex, desc, kw){
  if(ex === '说明') return `<tr><td class="desc" colspan="2">${hl(desc, kw)}</td></tr>`;
  return `<tr><td class="ex"><code data-copy="${encodeURIComponent(plain(ex))}">${hl(plain(ex), kw)}</code></td><td class="desc">${hl(desc, kw)}</td></tr>`;
}

function render(){
  const kw = q.value.trim();
  const low = kw.toLowerCase();
  const groups = DATA.map(g => ({
    cat: g.cat,
    rows: g.rows.filter(r => {
      if(!kw) return true;
      const ex = r[0];
      const desc = (r[1] || '') + (DESC_EXTRA[ex] || '');
      return (ex + ' ' + desc + ' ' + g.cat).toLowerCase().includes(low);
    })
  })).filter(g => g.rows.length);

  if(!groups.length){
    document.getElementById('head').innerHTML = '';
    document.getElementById('body').innerHTML = '<div class="empty">没有匹配的语法，换个关键词试试</div>';
    return;
  }
  document.getElementById('head').innerHTML = `
    <div class="notes">
      <h3>三条要点</h3>
      <ul>
        <li>方括号是单字符的 OR，圆括号是分组；<code>|</code> 用于整体择一匹配。</li>
        <li>量词默认贪婪，末尾加 <code>?</code> 变为懒惰匹配。</li>
        <li>本页语法为 JavaScript 正则，Python / Java 的个别写法（如后行断言宽度限制）略有差异。</li>
      </ul>
    </div>`;
  document.getElementById('body').innerHTML = groups.map(g => `
    <section>
      <h2>${g.cat}<span class="c">${g.rows.length} 条</span></h2>
      <table>${g.rows.map(r => row(r[0], r[1], kw)).join('')}</table>
    </section>`).join('');
}

const DESC_EXTRA = {};

let tid;
function tip(msg){
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(tid);
  tid = setTimeout(() => toast.classList.remove('on'), 1400);
}
document.addEventListener('click', e => {
  const c = e.target.closest('code[data-copy]');
  if(!c) return;
  const text = decodeURIComponent(c.dataset.copy);
  const done = () => tip('已复制 ' + text);
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(done).catch(() => fb(text, done)); }
  else fb(text, done);
});
function fb(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ tip('复制失败'); }
  document.body.removeChild(ta);
}
q.addEventListener('input', render);
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if(e.key === 'Escape'){ q.value=''; render(); q.blur(); }
});
render();
</script>
</body>
</html>
